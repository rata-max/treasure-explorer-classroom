name: Publish classroom Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'rata-max/treasure-explorer-classroom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public website only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require the explicitly scoped source credential
        env:
          SOURCE_READONLY_KEY: ${{ secrets.SOURCE_READONLY_KEY }}
        run: |
          if [ -z "$SOURCE_READONLY_KEY" ]; then
            echo 'SOURCE_READONLY_KEY is required; no site will be published.' >&2
            exit 1
          fi
      - name: Read private assignments without changing the source repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rata-max/treasure-explorer-challenge
          ref: main
          path: .private-source
          ssh-key: ${{ secrets.SOURCE_READONLY_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Test fail-closed release filtering
        run: node --test
      - name: Build only public assets and explicitly released ZIPs
        run: node scripts/build_site.mjs --source .private-source
      - name: Upload only the positive-allowlist site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified public artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
